<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flight Sim Builder — 機体設定 v1</title>
<style>
  :root{
    --bg:#0b1016;
    --panel:#121a24;
    --panel-2:#0e151d;
    --line:#233042;
    --text:#dbe6f0;
    --text-dim:#7f93a8;
    --accent:#3fa9ff;
    --accent-dim:#1c4a6e;
    --warn:#ff9f40;
    --ok:#4fd18b;
    --danger:#ff5d5d;
    --mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
    --sans: -apple-system, 'Hiragino Sans', 'Yu Gothic', 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden;}
  #app{display:grid;grid-template-columns:340px 1fr 320px;grid-template-rows:48px 1fr;height:100%;}

  /* Top bar */
  #topbar{grid-column:1/4;grid-row:1;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--panel-2);border-bottom:1px solid var(--line);}
  #topbar .brand{font-weight:600;letter-spacing:.02em;font-size:14px;color:var(--text);white-space:nowrap;}
  #topbar .brand span{color:var(--accent);}
  #topbar .sep{width:1px;height:22px;background:var(--line);}
  #topbar button{
    background:transparent;border:1px solid var(--line);color:var(--text);
    padding:6px 12px;border-radius:6px;font-size:12.5px;cursor:pointer;font-family:var(--sans);
    display:flex;align-items:center;gap:6px;transition:border-color .15s, background .15s;
  }
  #topbar button:hover{border-color:var(--accent-dim);background:#0f1822;}
  #topbar button.primary{background:var(--accent);border-color:var(--accent);color:#04121e;font-weight:600;}
  #topbar button.primary:hover{background:#5cb8ff;}
  #topbar .spacer{flex:1;}
  #topbarScroll{display:flex;align-items:center;gap:12px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;}
  #topbarScroll::-webkit-scrollbar{display:none;}
  #saveStatus{font-size:11.5px;color:var(--text-dim);font-family:var(--mono);white-space:nowrap;}
  input[type=file]{display:none;}
  .mobile-only{display:none;}
  #drawerOverlay{display:none;}

  /* Left: hierarchy / part list */
  #left{grid-column:1;grid-row:2;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;}
  #left .section-title{padding:12px 14px 8px;font-size:11px;letter-spacing:.04em;color:var(--text-dim);text-transform:uppercase;}
  #modelInfo{padding:0 14px 12px;font-size:12px;color:var(--text-dim);}
  #modelInfo .name{color:var(--text);font-size:13px;margin-bottom:2px;}
  #modelSettings{padding:0 14px 14px;border-bottom:1px solid var(--line);}
  #modelSettings .subgroup-title{font-size:12px;color:var(--text);margin:10px 0 8px;font-weight:600;}
  #modelSettings .subgroup-title:first-child{margin-top:0;}
  #partTypeButtons{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);}
  #partTypeButtons button{
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    padding:8px 6px;border-radius:6px;font-size:11.5px;cursor:pointer;font-family:var(--sans);
    display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1.3;
  }
  #partTypeButtons button:hover{border-color:var(--accent-dim);}
  #partTypeButtons button .ico{font-size:15px;}
  #partList{flex:1;overflow-y:auto;padding:6px 8px;}
  .part-row{
    display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:6px;cursor:pointer;
    font-size:12.5px;margin-bottom:2px;border:1px solid transparent;
  }
  .part-row:hover{background:var(--panel-2);}
  .part-row.selected{background:#132335;border-color:var(--accent-dim);}
  .part-row .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .part-row .label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .part-row .type{color:var(--text-dim);font-size:10.5px;font-family:var(--mono);}
  .part-row .del{color:var(--text-dim);font-size:14px;padding:0 4px;opacity:0;}
  .part-row:hover .del{opacity:1;}
  .part-row .del:hover{color:var(--danger);}
  #partList .empty{color:var(--text-dim);font-size:12px;padding:20px 12px;text-align:center;line-height:1.6;}

  /* Center: viewport */
  #center{grid-column:2;grid-row:2;position:relative;background:#000;overflow:hidden;}
  #viewport{width:100%;height:100%;display:block;}
  #dropHint{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:10px;pointer-events:none;color:var(--text-dim);
    background:radial-gradient(ellipse at center, rgba(20,30,42,.4), rgba(0,0,0,.7));
  }
  #dropHint .big{font-size:15px;color:var(--text);}
  #dropHint .small{font-size:12px;}
  #dropHint.hidden{display:none;}
  #gizmoModeBar{
    position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
    display:flex;gap:4px;background:rgba(14,21,29,.9);border:1px solid var(--line);
    border-radius:8px;padding:4px;backdrop-filter:blur(6px);
  }
  #gizmoModeBar button{
    background:transparent;border:none;color:var(--text-dim);padding:7px 12px;border-radius:6px;
    font-size:12px;cursor:pointer;font-family:var(--sans);
  }
  #gizmoModeBar button.active{background:var(--accent-dim);color:var(--text);}
  #axisViewBar{
    position:absolute;top:14px;right:14px;
    display:grid;grid-template-columns:repeat(3, 1fr);gap:4px;
    background:rgba(14,21,29,.9);border:1px solid var(--line);
    border-radius:8px;padding:4px;backdrop-filter:blur(6px);
  }
  #axisViewBar button{
    background:transparent;border:none;color:var(--text-dim);padding:6px 10px;border-radius:6px;
    font-size:11.5px;cursor:pointer;font-family:var(--sans);min-width:34px;
  }
  #axisViewBar button:hover{background:var(--accent-dim);color:var(--text);}
  #btnToggleProjection{
    position:absolute;top:76px;right:14px;
    background:rgba(14,21,29,.9);border:1px solid var(--line);color:var(--text-dim);
    padding:7px 11px;border-radius:8px;font-size:11.5px;cursor:pointer;font-family:var(--sans);
    backdrop-filter:blur(6px);white-space:nowrap;
  }
  #btnToggleProjection:hover{border-color:var(--accent-dim);}
  #btnToggleProjection.active{background:var(--accent-dim);color:var(--text);border-color:var(--accent);}
  #axisReadout{
    position:absolute;top:14px;left:14px;font-family:var(--mono);font-size:11px;color:var(--text-dim);
    background:rgba(14,21,29,.75);padding:8px 10px;border-radius:6px;border:1px solid var(--line);
    line-height:1.6;pointer-events:none;
  }
  #axisReadout .row{display:flex;gap:8px;}
  #axisReadout .axis-x{color:#ff6b6b;} #axisReadout .axis-y{color:#5cd65c;} #axisReadout .axis-z{color:#5c9cff;}

  /* Right: inspector */
  #right{grid-column:3;grid-row:2;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;}
  #inspector{padding:14px;}
  #inspector .section-title{font-size:11px;letter-spacing:.04em;color:var(--text-dim);text-transform:uppercase;margin:0 0 10px;}
  #inspector .empty{color:var(--text-dim);font-size:12.5px;line-height:1.7;padding-top:8px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:5px;}
  .field input[type=text], .field select{
    width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    padding:7px 9px;border-radius:6px;font-size:12.5px;font-family:var(--sans);
  }
  .field input[type=text]:focus, .field select:focus{outline:none;border-color:var(--accent-dim);}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
  .num-field{display:flex;flex-direction:column;gap:3px;}
  .num-field .axis-label{font-size:10px;font-family:var(--mono);text-align:center;}
  .num-field .axis-label.x{color:#ff6b6b;} .num-field .axis-label.y{color:#5cd65c;} .num-field .axis-label.z{color:#5c9cff;}
  .num-field input{
    width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    padding:6px 4px;border-radius:5px;font-size:12px;text-align:center;font-family:var(--mono);
  }
  .num-field input:focus{outline:none;border-color:var(--accent-dim);}
  .divider{height:1px;background:var(--line);margin:16px 0;}
  .subgroup-title{font-size:12px;color:var(--text);margin:0 0 10px;font-weight:600;}
  .hint{font-size:11px;color:var(--text-dim);line-height:1.6;margin-top:4px;}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .toggle-row label{font-size:12px;color:var(--text);}
  .switch{position:relative;width:36px;height:20px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .slider-toggle{position:absolute;inset:0;background:var(--panel-2);border:1px solid var(--line);border-radius:20px;cursor:pointer;transition:.15s;}
  .slider-toggle:before{content:"";position:absolute;width:14px;height:14px;left:2px;top:2px;background:var(--text-dim);border-radius:50%;transition:.15s;}
  input:checked + .slider-toggle{background:var(--accent-dim);border-color:var(--accent);}
  input:checked + .slider-toggle:before{transform:translateX(16px);background:var(--accent);}
  .color-swatch-row{display:flex;gap:6px;}
  .color-swatch{width:26px;height:26px;border-radius:6px;border:2px solid transparent;cursor:pointer;flex-shrink:0;}
  .color-swatch.active{border-color:#fff;}

  /* 着陸脚：関節/伸縮節のリスト行 */
  .joint-strut-row{
    background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    padding:10px;margin-bottom:8px;
  }
  .joint-strut-head{
    display:flex;align-items:center;justify-content:space-between;
    font-size:12px;color:var(--text);margin-bottom:8px;font-weight:600;
  }
  .joint-strut-head .del{color:var(--text-dim);font-size:14px;cursor:pointer;padding:0 4px;}
  .joint-strut-head .del:hover{color:var(--danger);}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:3px;
    background:var(--panel-2);border:1px solid var(--line);outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;
    background:var(--accent);cursor:pointer;border:2px solid #04121e;
  }
  input[type=range]::-moz-range-thumb{
    width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid #04121e;
  }
  .btn-danger-outline{
    width:100%;background:transparent;border:1px solid #4a2a2a;color:var(--danger);
    padding:8px;border-radius:6px;font-size:12px;cursor:pointer;font-family:var(--sans);margin-top:6px;
  }
  .btn-danger-outline:hover{background:#231414;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#233042;border-radius:5px;}
  ::-webkit-scrollbar-thumb:hover{background:#2d3f56;}

  #versionTag{
    position:absolute;bottom:14px;left:14px;font-family:var(--mono);font-size:11px;
    color:var(--text-dim);background:rgba(14,21,29,.75);padding:5px 9px;border-radius:5px;
    border:1px solid var(--line);pointer-events:none;white-space:pre-line;line-height:1.5;
    max-width:70vw;
  }
  #versionTag.err{color:#ff9a9a;border-color:#5a2a2a;background:rgba(35,20,20,.9);}
  #versionTag.ok{color:var(--ok);}

  #toast{
    position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(10px);
    background:#152030;border:1px solid var(--line);color:var(--text);padding:9px 16px;border-radius:7px;
    font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:999;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ============ モバイル / 縦画面 対応 ============ */
  .drawer-close{
    display:none;width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text-dim);
    padding:10px;border-radius:6px;font-size:12.5px;cursor:pointer;font-family:var(--sans);margin:10px 10px 4px;
    width:calc(100% - 20px);
  }
  .drawer-toggle{
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    padding:7px 11px;border-radius:6px;font-size:12px;cursor:pointer;font-family:var(--sans);white-space:nowrap;
    touch-action:manipulation;-webkit-tap-highlight-color:rgba(63,169,255,.3);position:relative;z-index:1;
  }

  @media (max-width: 860px){
    /* 3カラム→1カラム。左右パネルはオーバーレイ式ドロワーに切替 */
    #app{grid-template-columns:1fr;grid-template-rows:48px 1fr;}
    #topbar{grid-column:1;padding:0 8px;gap:8px;}
    #topbar .brand{font-size:12px;}
    #topbar button{padding:6px 9px;font-size:11.5px;}
    .mobile-only{display:flex;}

    #left, #right{
      position:fixed;top:48px;bottom:0;width:min(86vw, 340px);z-index:200;
      transition:transform .22s ease;box-shadow:0 0 24px rgba(0,0,0,.5);
    }
    #left{left:0;transform:translateX(-100%);grid-column:unset;grid-row:unset;border-right:1px solid var(--line);}
    #right{right:0;transform:translateX(100%);grid-column:unset;grid-row:unset;border-left:1px solid var(--line);}
    #left.drawer-open, #right.drawer-open{transform:translateX(0);}

    #drawerOverlay.show{
      display:block;position:fixed;inset:48px 0 0 0;background:rgba(0,0,0,.5);z-index:150;
    }

    #center{grid-column:1;grid-row:2;}

    .drawer-close{display:block;}

    /* ビューポート上のフローティングUIを画面幅に合わせて縮小・再配置 */
    #axisReadout{top:8px;left:8px;font-size:10px;padding:6px 8px;}
    #axisViewBar{top:8px;right:8px;padding:3px;gap:3px;}
    #axisViewBar button{padding:5px 8px;font-size:10.5px;min-width:28px;}
    #btnToggleProjection{top:66px;right:8px;padding:5px 9px;font-size:10.5px;}
    #gizmoModeBar{bottom:64px;padding:3px;}
    #gizmoModeBar button{padding:6px 10px;font-size:11px;}
    #versionTag{bottom:8px;left:8px;font-size:9.5px;max-width:60vw;}
    #dropHint .big{font-size:13px;text-align:center;padding:0 20px;}
    #dropHint .small{font-size:11px;text-align:center;padding:0 20px;}
  }

  /* 縦画面のスマホ：ビューポートの縦幅がさらに厳しいので、フローティングUIをもう一段圧縮 */
  @media (max-width: 860px) and (orientation: portrait){
    #gizmoModeBar{bottom:12px;left:auto;right:8px;transform:none;flex-direction:column;}
    #axisViewBar{grid-template-columns:repeat(2, 1fr);}
    #axisReadout{max-width:40vw;}
    #btnToggleProjection{top:108px;} /* axisViewBarが2列×3行になり縦に伸びるため、その分下げる */
    #topbar .brand{display:none;} /* 縦画面の狭い横幅ではブランド名を省略しボタン領域を確保 */
    #topbar .sep{display:none;}
  }

  /* 非常に狭い画面（幅400px未満）：トップバーのボタンラベルをアイコンのみに */
  @media (max-width: 400px){
    #btnLoadModel::before{content:"📂 読込";}
    #btnLoadModel{font-size:0;}
    #btnLoadModel::before{font-size:11.5px;}
    #btnSaveConfig::before{content:"💾 保存";}
    #btnSaveConfig{font-size:0;}
    #btnSaveConfig::before{font-size:11.5px;}
    #btnLoadSaved::before{content:"📁 開く";}
    #btnLoadSaved{font-size:0;}
    #btnLoadSaved::before{font-size:11.5px;}
  }
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <button id="btnTogglePartsDrawer" class="drawer-toggle mobile-only" title="パーツ一覧">☰ パーツ</button>
    <div class="brand">FLIGHT SIM <span>BUILDER</span></div>
    <div class="sep"></div>
    <div id="topbarScroll">
      <button id="btnLoadModel">機体モデルを読込</button>
      <button id="btnSaveConfig" class="primary">保存</button>
      <button id="btnLoadSaved">保存済みを開く</button>
    </div>
    <div class="spacer"></div>
    <span id="saveStatus"></span>
    <button id="btnToggleInspectorDrawer" class="drawer-toggle mobile-only" title="プロパティ">設定 ⚙</button>
  </div>

  <div id="drawerOverlay"></div>

  <div id="left">
    <button class="drawer-close mobile-only" id="btnCloseLeft">✕ 閉じる</button>
    <div class="section-title">機体</div>
    <div id="modelInfo">
      <div class="name">モデル未読込</div>
      <div id="modelMeta">GLB / GLTFファイルを読み込んでください</div>
    </div>

    <div id="modelSettings" style="display:none;"></div>

    <div class="section-title" style="padding-bottom:0;">パーツを追加</div>
    <div id="partTypeButtons">
      <button data-type="engine"><span class="ico">◎</span>エンジン</button>
      <button data-type="wing"><span class="ico">▱</span>翼／尾翼</button>
      <button data-type="control_surface"><span class="ico">◧</span>可動翼面</button>
      <button data-type="light"><span class="ico">✦</span>航行灯</button>
      <button data-type="landing_gear" style="grid-column:1/3;"><span class="ico">⊥</span>着陸脚</button>
    </div>

    <div class="section-title">パーツ一覧</div>
    <div id="partList"><div class="empty">まだパーツがありません。<br>上のボタンでモデル上に配置してください。</div></div>
  </div>

  <div id="center">
    <canvas id="viewport"></canvas>
    <div id="dropHint">
      <div class="big">機体モデル（.glb / .gltf）をドラッグ＆ドロップ</div>
      <div class="small">またはツールバーの「機体モデルを読込」から選択</div>
    </div>
    <div id="axisReadout" style="display:none;"></div>
    <div id="axisViewBar">
      <button data-axis="front">前</button>
      <button data-axis="back">後</button>
      <button data-axis="left">左</button>
      <button data-axis="right">右</button>
      <button data-axis="top">上</button>
      <button data-axis="bottom">下</button>
    </div>
    <button id="btnToggleProjection" title="遠近法（クリックで平行投影に切替）">⬚ 平行投影</button>
    <div id="gizmoModeBar" style="display:none;">
      <button data-mode="translate" class="active">移動</button>
      <button data-mode="rotate">回転</button>
      <button data-mode="scale">拡縮</button>
    </div>
    <div id="versionTag">起動中…</div>
  </div>

  <div id="right">
    <button class="drawer-close mobile-only" id="btnCloseRight">✕ 閉じる</button>
    <div id="inspector">
      <div class="section-title">プロパティ</div>
      <div class="empty">左のパーツ一覧、またはビューポート内のパーツをクリックして選択してください。</div>
    </div>
  </div>

</div>

<input type="file" id="fileInput" accept=".glb,.gltf">
<div id="toast"></div>

<script>
  // 診断ログ：各<script>の読込成否をここに積み、画面左下(#versionTag)にまとめて表示する。
  // 外部ファイルに一切依存しない自己完結ブロックなので、他のJSが全滅していてもここだけは動く。
  window._loadLog = { failedScripts: [], cdnOk: false };
  function _markFailed(label) {
    window._loadLog.failedScripts.push(label);
    _renderVersionTag();
  }
  function _renderVersionTag() {
    const el = document.getElementById('versionTag');
    if (!el) return;
    const log = window._loadLog;
    if (log.failedScripts.length > 0) {
      el.className = 'err';
      el.textContent = '読込失敗: ' + log.failedScripts.join(', ') + '\n(パス／ネットワークをご確認ください)';
      return;
    }
    if (typeof bootstrapOk !== 'undefined' && bootstrapOk) {
      el.className = 'ok';
      el.textContent = 'Flight Sim Builder ' + (typeof APP_VERSION !== 'undefined' ? APP_VERSION : '?');
    }
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js" onerror="_markFailed('three.min.js (CDN)')"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js" onerror="_markFailed('GLTFLoader.js (CDN)')"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js" onerror="_markFailed('OrbitControls.js (CDN)')"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js" onerror="_markFailed('TransformControls.js (CDN)')"></script>
<script>
  // CDNタグ自体は読めても中身がGLTFLoader等を定義していないケースの検知
  window.addEventListener('DOMContentLoaded', () => {
